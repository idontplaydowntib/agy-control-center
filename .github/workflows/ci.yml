name: AGY Control Center CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Syntax, Security & Telemetry Verification
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile & Syntax Check (Python)
        run: |
          python -I -m py_compile agy_hub.py
          python -I -m py_compile tests/test_smoke.py

      - name: Syntax Check (JavaScript)
        run: node --check static/app.js

      - name: Privacy & Secret Hygiene Gate
        shell: pwsh
        run: |
          if (Test-Path "data/accounts.json") {
            Write-Error "data/accounts.json must never be tracked in Git!"
            exit 1
          }
          $tracked = git ls-files
          foreach ($f in $tracked) {
            if ($f -match "\.(png|jpg|gif)$") { continue }
            $content = Get-Content $f -Raw -ErrorAction SilentlyContinue
            if ($content -match "C:\\Users\\[a-zA-Z0-9_]+" -or $content -match "c:/Users/[a-zA-Z0-9_]+") {
              Write-Error "Hardcoded local Windows user path detected in $f"
              exit 1
            }
          }
          Write-Host "Privacy & secret hygiene gate passed with zero leaks."

      # Stdlib-only suite: catalog/dedup rules, Argon sync retry + stale handling,
      # Add Account link flow and the HTTP API, with all Google/WinCred calls stubbed.
      - name: Telemetry, Sync & API Smoke Tests
        run: python -I tests/test_smoke.py
